<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IoT Dashboard - REST API</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
        padding: 20px;
        color: #333;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
      }

      h1 {
        color: white;
        text-align: center;
        margin-bottom: 25px;
        font-size: 28px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-bottom: 25px;
      }

      .card {
        background: white;
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        text-align: center;
        transition: transform 0.2s;
      }

      .card:hover {
        transform: translateY(-5px);
      }

      .card .label {
        font-size: 14px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .card .value {
        font-size: 42px;
        font-weight: bold;
        margin: 10px 0;
        color: #667eea;
      }

      .card .unit {
        font-size: 18px;
        color: #aaa;
      }

      .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
      }

      .status-online {
        background: #d4edda;
        color: #155724;
      }

      .status-offline {
        background: #f8d7da;
        color: #721c24;
      }

      .panel {
        background: white;
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        margin-bottom: 25px;
      }

      .panel h2 {
        font-size: 18px;
        margin-bottom: 15px;
        color: #444;
      }

      .controls {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
      }

      .btn {
        padding: 12px 30px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-on {
        background: #28a745;
        color: white;
      }

      .btn-on:hover {
        background: #218838;
      }

      .btn-off {
        background: #dc3545;
        color: white;
      }

      .btn-off:hover {
        background: #c82333;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 10px;
        text-align: left;
        border-bottom: 1px solid #eee;
        font-size: 14px;
      }

      th {
        background: #f8f9fa;
        color: #666;
        text-transform: uppercase;
        font-size: 12px;
      }

      tr:hover td {
        background: #f9f9f9;
      }

      #log {
        background: #1e1e1e;
        color: #0f0;
        font-family: monospace;
        padding: 15px;
        border-radius: 10px;
        max-height: 180px;
        overflow-y: auto;
        font-size: 13px;
        line-height: 1.6;
      }

      #log .error {
        color: #f66;
      }

      #log .info {
        color: #6af;
      }

      #alert-banner {
        display: none;
        background: #dc3545;
        color: #fff;
        padding: 14px 20px;
        border-radius: 12px;
        margin-bottom: 20px;
        font-weight: 600;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
      .conn {
        text-align: center;
        color: #fff;
        margin: -10px 0 20px;
        font-size: 13px;
        opacity: 0.9;
      }
      .chart-wrap {
        position: relative;
        height: 280px;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      .row label {
        font-size: 14px;
        color: #555;
        min-width: 110px;
      }
      .row input {
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
      }
      .btn-primary {
        background: #667eea;
        color: #fff;
      }
      .btn-primary:hover {
        background: #5568d3;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>IoT Dashboard — REST API</h1>

      <div id="alert-banner"></div>
      <div class="conn">Mode: <b id="mode">menghubungkan…</b></div>

      <!-- Kartu Sensor -->
      <div class="cards">
        <div class="card">
          <div class="label">Suhu</div>
          <div class="value" id="suhu">--</div>
          <div class="unit">°C</div>
        </div>

        <div class="card">
          <div class="label">Kelembaban</div>
          <div class="value" id="kelembaban">--</div>
          <div class="unit">%</div>
        </div>

        <div class="card">
          <div class="label">Status Sensor</div>
          <div class="value" style="font-size: 22px" id="status">
            <span class="status-badge status-offline" id="status-badge">
              OFFLINE
            </span>
          </div>
        </div>
      </div>

      <!-- Grafik Real-time -->
      <div class="panel">
        <h2>Grafik Real-time</h2>
        <div class="chart-wrap"><canvas id="chart"></canvas></div>
      </div>

      <!-- Kontrol Perangkat -->
      <div class="panel">
        <h2>Kontrol Perangkat</h2>

        <div class="controls">
          <button class="btn btn-on" onclick="kontrol('lamp', 'on')">
            Nyalakan Lampu
          </button>

          <button class="btn btn-off" onclick="kontrol('lamp', 'off')">
            Matikan Lampu
          </button>
        </div>
      </div>

      <!-- Pengaturan -->
      <div class="panel">
        <h2>Pengaturan</h2>
        <div class="row">
          <label for="th-input">Batas suhu (°C)</label>
          <input id="th-input" type="number" step="0.1" min="0" max="100" />
          <button class="btn btn-primary" onclick="simpanBatas()">
            Simpan Batas
          </button>
        </div>
        <div class="row">
          <label for="key-input">API Key</label>
          <input id="key-input" type="password" />
          <button class="btn btn-primary" onclick="simpanKey()">
            Simpan Key
          </button>
        </div>
      </div>

      <!-- History Sensor -->
      <div class="panel">
        <h2>10 Data Sensor Terakhir</h2>

        <table>
          <thead>
            <tr>
              <th>Waktu</th>
              <th>Suhu (°C)</th>
              <th>Kelembaban (%)</th>
            </tr>
          </thead>

          <tbody id="history-body">
            <tr>
              <td colspan="3" style="text-align: center; color: #999">
                Loading...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Log Aktivitas -->
      <div class="panel">
        <h2>Log Aktivitas</h2>
        <div id="log"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script>
      // ==============================
      // KONFIGURASI
      // ==============================
      const isHttp = location.protocol.startsWith("http");
      const API_BASE = isHttp ? "/api" : "http://localhost:1880/api";
      const WS_URL =
        (location.protocol === "https:" ? "wss://" : "ws://") +
        (isHttp ? location.host : "localhost:1880") +
        "/ws/sensor";
      const MAX_POINTS = 30;

      let apiKey = localStorage.getItem("apiKey") || "rahasia123";
      let threshold = 30,
        rows = [],
        lastReceived = 0;
      let ws = null,
        pollTimer = null,
        retry = 0;
      const $ = (id) => document.getElementById(id);

      // ==============================
      // UTILITY
      // ==============================
      function log(msg, type = "info") {
        const el = $("log");
        el.innerHTML += `<div class="${type}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        el.scrollTop = el.scrollHeight;
      }

      async function api(path, opts = {}) {
        const res = await fetch(API_BASE + path, {
          ...opts,
          headers: { "Content-Type": "application/json", "X-API-Key": apiKey },
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.message || `HTTP ${res.status}`);
        return json;
      }

      // ==============================
      // CHART.JS
      // ==============================
      const chart = new Chart($("chart"), {
        type: "line",
        data: {
          labels: [],
          datasets: [
            {
              label: "Suhu (°C)",
              data: [],
              borderColor: "#667eea",
              backgroundColor: "#667eea33",
              tension: 0.3,
              yAxisID: "y",
            },
            {
              label: "Kelembaban (%)",
              data: [],
              borderColor: "#20c997",
              tension: 0.3,
              yAxisID: "y1",
            },
            {
              label: "Batas suhu",
              data: [],
              borderColor: "#dc3545",
              borderDash: [6, 6],
              pointRadius: 0,
              yAxisID: "y",
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          scales: {
            y: { title: { display: true, text: "°C" } },
            y1: {
              position: "right",
              grid: { drawOnChartArea: false },
              title: { display: true, text: "%" },
            },
          },
        },
      });

      function refreshChart() {
        const last = rows.slice(-MAX_POINTS);
        chart.data.labels = last.map((d) =>
          new Date(d.received).toLocaleTimeString(),
        );
        chart.data.datasets[0].data = last.map((d) => d.suhu);
        chart.data.datasets[1].data = last.map((d) => d.kelembaban);
        chart.data.datasets[2].data = last.map(() => threshold);
        chart.update();
      }

      // ==============================
      // RENDER
      // ==============================
      function renderTable() {
        const tbody = $("history-body");
        if (rows.length === 0) {
          tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;color:#999;">Belum ada data</td></tr>`;
          return;
        }
        tbody.innerHTML = rows
          .slice(-10)
          .reverse()
          .map(
            (d) => `
          <tr>
            <td>${new Date(d.received).toLocaleTimeString()}</td>
            <td>${d.suhu}</td>
            <td>${d.kelembaban}</td>
          </tr>`,
          )
          .join("");
      }

      function showCards(d) {
        $("suhu").textContent = d.suhu;
        $("kelembaban").textContent = d.kelembaban;
        lastReceived = new Date(d.received).getTime();
        updateBanner(d.suhu);
      }

      function updateBanner(suhu) {
        const b = $("alert-banner");
        if (suhu > threshold) {
          b.textContent = `⚠ Suhu ${suhu}°C melewati batas ${threshold}°C`;
          b.style.display = "block";
        } else {
          b.style.display = "none";
        }
      }

      function setThreshold(v) {
        threshold = v;
        if (document.activeElement !== $("th-input")) $("th-input").value = v;
        const last = rows[rows.length - 1];
        if (last) updateBanner(last.suhu);
        refreshChart();
      }

      function setMode(text) {
        $("mode").textContent = text;
      }

      setInterval(() => {
        const badge = $("status-badge");
        const online = Date.now() - lastReceived < 10000;
        badge.textContent = online ? "ONLINE" : "OFFLINE";
        badge.className =
          "status-badge " + (online ? "status-online" : "status-offline");
      }, 2000);

      // ==============================
      // DATA: sensor baru (WebSocket / polling)
      // ==============================
      function handleSensor(d) {
        rows.push(d);
        if (rows.length > 50) rows.shift();
        showCards(d);
        renderTable();
        refreshChart();
      }

      function onAlert(m) {
        log(m.message, m.level === "danger" ? "error" : "info");
        if (
          m.level === "danger" &&
          "Notification" in window &&
          Notification.permission === "granted"
        ) {
          new Notification("Peringatan Suhu", { body: m.message });
        }
      }

      async function loadHistory() {
        try {
          const json = await api("/history?limit=50");
          rows = json.data || [];
          renderTable();
          refreshChart();
          const last = rows[rows.length - 1];
          if (last) showCards(last);
        } catch (err) {
          log(`Gagal fetch history: ${err.message}`, "error");
        }
      }

      async function loadThreshold() {
        try {
          const json = await api("/threshold");
          setThreshold(json.batas);
        } catch (err) {
          log(`Gagal fetch threshold: ${err.message}`, "error");
        }
      }

      // ==============================
      // WEBSOCKET (+ fallback polling)
      // ==============================
      function startPolling() {
        if (pollTimer) return;
        setMode("Polling (WebSocket terputus)");
        pollTimer = setInterval(loadHistory, 3000);
      }
      function stopPolling() {
        clearInterval(pollTimer);
        pollTimer = null;
      }

      function connectWS() {
        try {
          ws = new WebSocket(WS_URL);
        } catch (e) {
          startPolling();
          return;
        }
        ws.onopen = () => {
          retry = 0;
          stopPolling();
          setMode("WebSocket (real-time)");
          log("WebSocket terhubung, polling dimatikan");
          loadHistory();
        };
        ws.onmessage = (e) => {
          let m;
          try {
            m = JSON.parse(e.data);
          } catch {
            return;
          }
          if (m.type === "sensor") {
            if (m.threshold !== undefined && m.threshold !== threshold)
              setThreshold(m.threshold);
            handleSensor(m.data);
          } else if (m.type === "threshold") {
            setThreshold(m.batas);
            log(`Batas suhu diubah menjadi ${m.batas}°C`);
          } else if (m.type === "alert") {
            onAlert(m);
          }
        };
        ws.onclose = () => {
          startPolling();
          setTimeout(connectWS, Math.min(30000, 2000 * ++retry));
        };
      }

      // ==============================
      // AKSI
      // ==============================
      async function kontrol(device, action) {
        try {
          const json = await api("/kontrol", {
            method: "POST",
            body: JSON.stringify({ device, action }),
          });
          log(`Perintah terkirim: ${device} → ${action}`, "info");
        } catch (err) {
          log(`Error kontrol: ${err.message}`, "error");
        }
      }

      async function simpanBatas() {
        const v = parseFloat($("th-input").value);
        if ("Notification" in window && Notification.permission === "default")
          Notification.requestPermission();
        try {
          await api("/threshold", {
            method: "PUT",
            body: JSON.stringify({ batas: v }),
          });
          log(`Batas suhu disimpan: ${v}°C`);
        } catch (err) {
          log(`Gagal simpan batas: ${err.message}`, "error");
        }
      }

      function simpanKey() {
        apiKey = $("key-input").value.trim();
        localStorage.setItem("apiKey", apiKey);
        log("API key disimpan");
        loadThreshold();
        loadHistory();
      }

      // ==============================
      // START
      // ==============================
      $("key-input").value = apiKey;
      log("Dashboard dimulai");
      loadThreshold();
      loadHistory();
      connectWS();
    </script>
  </body>
</html>
